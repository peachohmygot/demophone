<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <title>Phone Catalog</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>" />
</head>
<body>
  <div class="wrap">

    <!-- Search -->
    <div class="searchbar">
      <input id="search" type="text" autocomplete="off" />
    </div>

    <!-- Category tabs (built by JS) -->
    <div class="tabs" id="tabs"></div>

    <!-- Filters + sort -->
    <div class="controls">
      <select id="filterBrand"></select>
      <select id="filterModel"></select>

      <div class="price-range">
        <input type="number" id="priceMin" min="0" />
        <span>–</span>
        <input type="number" id="priceMax" min="0" />
      </div>

      <div class="sort-wrap">
        <button id="sortBtn"></button>
        <div class="sort-menu" id="sortMenu">
          <button data-sort="newest" class="active"></button>
          <button data-sort="price_asc"></button>
          <button data-sort="price_desc"></button>
          <button data-sort="disc_desc"></button>
          <button data-sort="disc_asc"></button>
          <button data-sort="year_desc"></button>
          <button data-sort="year_asc"></button>
          <button data-sort="cond_desc"></button>
          <button data-sort="cond_asc"></button>
        </div>
      </div>

      <button id="langToggle" class="lang-btn"></button>
    </div>

    <div class="result-count" id="count"></div>

    <!-- Products -->
    <div id="grid" class="grid"></div>
    <div id="status" class="hidden"></div>

  </div>

  <button id="toTop" class="to-top" aria-label="Back to top">↑</button>
  <div class="toast" id="toast"></div>
  <script type="module" src="./js/catalog.js"></script>
</body>
</html>
